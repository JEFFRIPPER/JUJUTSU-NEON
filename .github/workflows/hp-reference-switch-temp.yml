name: Temporary Hollow Purple Reference Switch

on:
  push:
    branches: [main]

jobs:
  verify-and-switch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Route Purple packets to reference renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/kira/jujutsuneon/HollowPurpleOverhaul.java')
          s = p.read_text(encoding='utf-8')
          old = '() -> () -> HollowPurpleClient.accept(msg)'
          new = '() -> () -> HollowPurpleReferenceClient.accept(msg)'
          if new not in s:
              if old not in s:
                  raise SystemExit('Purple packet handler target not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Compile Forge 1.20.1 reobf
        run: gradle reobfJar --stacktrace --no-daemon
      - name: Count source lines
        run: wc -l src/main/java/com/kira/jujutsuneon/*.java
      - name: Commit verified switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/kira/jujutsuneon/HollowPurpleOverhaul.java
          if ! git diff --cached --quiet; then
            git commit -m 'feat: activate reference Hollow Purple renderer [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: HollowPurple-Reference-Reobf
          path: build/libs/*.jar
          if-no-files-found: error
