name: Temporary Hard Movement Contract Pass

on:
  push:
    branches: [movement-hard-contract-pass-2]

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Apply strict movement architecture pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('src/main/java/com/kira/jujutsuneon')

          # ------------------------------------------------------------------
          # 1) Hard movement contract
          # ------------------------------------------------------------------
          contract = Path('MOVEMENT_CONTRACT.md')
          contract.write_text('''# JUJUTSU NEON — Movement Contract

This file is a hard contract. A movement change is invalid if any invariant below is violated.

## Authority model
- Blindfold OFF: vanilla Minecraft movement is untouched.
- Gojo blindfold ON: Jujutsu Neon owns movement physics.
- Exactly one movement state may own motion in a tick.
- Legal client states are: `LOCKED`, `DASH`, `FLIGHT`, `WATER_RUN`, `WATER`, `GROUND`, `AIR`.
- A state transition must release ownership before the next state writes velocity/position.
- No second event handler may independently start the same dash or rewrite the same movement vector.

## Coordinate invariants
- Camera-forward is the look-relative forward basis.
- Camera-right is `(-forward.z, 0, forward.x)`.
- W = +forward.
- S = -forward.
- A = -right.
- D = +right.
- No downstream patch may invert A/D again.

## Ground / air invariants
- Ordinary walking/running must visibly drive vanilla limb locomotion; no rigid sliding doll.
- Walking off a ledge may not cause a horizontal stop-frame.
- Charged jump preserves horizontal momentum.
- Airborne WASD control preserves vertical velocity.
- Ascending 1–2 block obstacles may use the existing swept step-up solver.
- Descending terrain must follow the ground smoothly instead of snapping/rubber-banding.
- Client collision may never enter a block that still exists authoritatively on the server.

## Water invariants
- WATER and FLIGHT are mutually exclusive.
- Entering water may never activate or preserve custom flight.
- Without Ctrl: custom WATER state behaves like normal swimming, including vertical swim controls.
- With Ctrl: WATER_RUN owns surface-running only.
- If surface-running cannot acquire the surface, control falls back to WATER; it never freezes the player.

## Dash invariants
- Air Dash does not exist.
- A dash may start only with ground support.
- Q starts a dash only when BOTH hands are empty.
- Any item in either hand + Q remains Minecraft item-drop behavior; no client prediction and no dash packet.
- W+Q / neutral+Q = steerable Front Dash.
- S+Q = steerable Back Dash opposite camera-forward.
- A+Q = left Side Dash.
- D+Q = right Side Dash.
- Front Dash pose/steering/distance are protected reference behavior.
- Back Dash uses its own full-body reverse silhouette.
- Side Dash may bank modestly as one coherent body; it may not fold or dislocate the torso.
- Server hit direction must match the client steering vector.

## Flight invariants
- Flight may begin only from the charged-jump apex flow.
- Flight direction follows the camera/look vector: look up = fly up, look down = fly down.
- W/S travel along/opposite the full look vector. A/D strafe on the camera-relative horizontal right axis.
- Space/Shift are not the primary vertical flight axes.
- Ctrl changes flight speed only; it does not hand movement back to Super Run.
- Entering water immediately ends flight and transfers ownership to WATER.

## Tree / destruction invariants
- Client code must NEVER delete a world block as movement prediction.
- Super Run tree/foliage destruction is server-authoritative.
- The client may request a small swept path clear, but must wait for authoritative block updates before entering it.
- Tree detection must be bounded; no per-tick breadth-first traversal of an entire trunk/canopy.
- A tree base one block above the player is included in the swept clear volume.

## Animation lifecycle invariants
- Vanilla locomotion is the base pose.
- Temporary skill/dash pose exists only while its timer/state is active.
- When a timer reaches zero, active animation becomes `NONE` immediately.
- Renderer model swaps must be restored in Post and defensively before the next Pre.
- Purple/Blue/Front Dash reference visuals may not regress due to unrelated movement fixes.

## Red safety invariants
- The caster is excluded from normal Red custom victims.
- The caster cannot be hurt or knocked back by their own Red explosion path.
- Blocks supporting/intersecting the caster are restored/protected from normal Red.
''', encoding='utf-8')

          # ------------------------------------------------------------------
          # 2) Rewrite client movement compatibility layer: one dash input owner,
          #    no Air Dash, no client-side tree deletion.
          # ------------------------------------------------------------------
          movement_client = root / 'JujutsuNeonMovementPatchClient.java'
          movement_client.write_text(r'''package com.kira.jujutsuneon;

import net.minecraft.client.Minecraft;
import net.minecraft.core.BlockPos;
import net.minecraft.core.particles.ParticleTypes;
import net.minecraft.tags.FluidTags;
import net.minecraft.world.entity.EquipmentSlot;
import net.minecraft.world.level.ClipContext;
import net.minecraft.world.phys.AABB;
import net.minecraft.world.phys.BlockHitResult;
import net.minecraft.world.phys.HitResult;
import net.minecraft.world.phys.Vec3;
import net.minecraftforge.api.distmarker.Dist;
import net.minecraftforge.event.TickEvent;
import net.minecraftforge.eventbus.api.EventPriority;
import net.minecraftforge.eventbus.api.SubscribeEvent;
import net.minecraftforge.fml.common.Mod;

import java.lang.reflect.Field;
import java.lang.reflect.Method;

/**
 * Client side of the strict blindfold movement contract.
 *
 * This class owns the Q decision and dash steering only. It must never delete world
 * blocks locally. Ground/air/water locomotion remains in ClientForgeEvents and flight
 * remains in JujutsuNeonFlightClient, with mutually exclusive state ownership.
 */
@Mod.EventBusSubscriber(
        modid = JujutsuNeonMod.MODID,
        bus = Mod.EventBusSubscriber.Bus.FORGE,
        value = Dist.CLIENT
)
public final class JujutsuNeonMovementPatchClient {

    private static final Class<?> CLIENT_EVENTS_CLASS;
    private static final Class<?> MOVEMENT_ACTION_CLASS;
    private static final Method START_CLIENT_DASH;
    private static final Method START_ANIM;
    private static final Field CLIENT_DASH_MODE;
    private static final Field CLIENT_DASH_DIRECTION;
    private static final Field HUD_MAX_BLUE_ACTIVE;
    private static final Field HUD_PURPLE_CASTING;

    private static Vec3 desiredDashDirection = Vec3.ZERO;
    private static JujutsuNeonMovementPatch.DashKind activePatchedDash = null;
    private static long lastDashStartTick = -1000L;
    private static long lastSuperRunClearRequestTick = -1000L;

    static {
        try {
            CLIENT_EVENTS_CLASS = Class.forName("com.kira.jujutsuneon.JujutsuNeonMod$ClientForgeEvents");
            MOVEMENT_ACTION_CLASS = Class.forName("com.kira.jujutsuneon.JujutsuNeonMod$MovementAction");

            START_CLIENT_DASH = CLIENT_EVENTS_CLASS.getDeclaredMethod(
                    "startClientDash", Minecraft.class, MOVEMENT_ACTION_CLASS
            );
            START_CLIENT_DASH.setAccessible(true);

            START_ANIM = CLIENT_EVENTS_CLASS.getDeclaredMethod("startAnim", String.class, int.class);
            START_ANIM.setAccessible(true);

            CLIENT_DASH_MODE = CLIENT_EVENTS_CLASS.getDeclaredField("clientDashMode");
            CLIENT_DASH_MODE.setAccessible(true);

            CLIENT_DASH_DIRECTION = CLIENT_EVENTS_CLASS.getDeclaredField("clientDashDirection");
            CLIENT_DASH_DIRECTION.setAccessible(true);

            HUD_MAX_BLUE_ACTIVE = CLIENT_EVENTS_CLASS.getDeclaredField("hudMaxBlueActive");
            HUD_MAX_BLUE_ACTIVE.setAccessible(true);

            HUD_PURPLE_CASTING = CLIENT_EVENTS_CLASS.getDeclaredField("hudPurpleCasting");
            HUD_PURPLE_CASTING.setAccessible(true);
        } catch (ReflectiveOperationException exception) {
            throw new ExceptionInInitializerError(exception);
        }
    }

    private JujutsuNeonMovementPatchClient() {}

    private static boolean hasBlindfold(Minecraft mc) {
        return mc.player != null &&
                mc.player.getItemBySlot(EquipmentSlot.HEAD).is(JujutsuNeonMod.GOJO_BLINDFOLD.get());
    }

    private static boolean handsEmpty(Minecraft mc) {
        return mc.player != null && mc.player.getMainHandItem().isEmpty() && mc.player.getOffhandItem().isEmpty();
    }

    private static boolean techniqueLocksMovement() {
        try {
            return HUD_MAX_BLUE_ACTIVE.getBoolean(null) || HUD_PURPLE_CASTING.getBoolean(null);
        } catch (IllegalAccessException exception) {
            return true;
        }
    }

    private static int legacyDashMode() {
        try {
            return CLIENT_DASH_MODE.getInt(null);
        } catch (IllegalAccessException exception) {
            return 0;
        }
    }

    private static void setLegacyDashDirection(Vec3 direction) {
        try {
            CLIENT_DASH_DIRECTION.set(null, direction);
        } catch (IllegalAccessException ignored) {
        }
    }

    private static boolean hasGroundSupport(Minecraft mc, double distance) {
        if (mc.player == null || mc.level == null) return false;
        if (mc.player.onGround()) return true;

        Vec3 start = mc.player.position().add(0.0, 0.08, 0.0);
        Vec3 end = start.add(0.0, -Math.max(0.10, distance), 0.0);
        BlockHitResult hit = mc.level.clip(new ClipContext(
                start, end, ClipContext.Block.COLLIDER, ClipContext.Fluid.NONE, mc.player
        ));
        return hit.getType() != HitResult.Type.MISS;
    }

    private static Vec3 horizontalForward(Minecraft mc) {
        Vec3 look = mc.player.getLookAngle();
        Vec3 horizontal = new Vec3(look.x, 0.0, look.z);
        if (horizontal.lengthSqr() < 1.0E-6) {
            double yaw = Math.toRadians(mc.player.getYRot());
            horizontal = new Vec3(-Math.sin(yaw), 0.0, Math.cos(yaw));
        }
        return horizontal.normalize();
    }

    private static Vec3 correctedDashDirection(Minecraft mc, JujutsuNeonMovementPatch.DashKind kind) {
        Vec3 forward = horizontalForward(mc);
        Vec3 right = new Vec3(-forward.z, 0.0, forward.x).normalize();
        return switch (kind) {
            case LEFT -> right.scale(-1.0);
            case RIGHT -> right;
            case BACK -> forward.scale(-1.0);
            case FRONT -> forward;
        };
    }

    private static Object movementAction(String name) {
        for (Object constant : MOVEMENT_ACTION_CLASS.getEnumConstants()) {
            if (constant instanceof Enum<?> value && value.name().equals(name)) return constant;
        }
        throw new IllegalArgumentException("Unknown movement action: " + name);
    }

    private static void startLegacyAnimation(JujutsuNeonMovementPatch.DashKind kind) {
        String animation = switch (kind) {
            case BACK -> "BACK_DASH";
            case LEFT -> "SIDE_DASH_LEFT";
            case RIGHT -> "SIDE_DASH_RIGHT";
            case FRONT -> "FRONT_DASH";
        };
        int ticks = switch (kind) {
            case LEFT, RIGHT -> 8;
            case FRONT, BACK -> 14;
        };

        try {
            START_ANIM.invoke(null, animation, ticks);
        } catch (ReflectiveOperationException ignored) {
        }
    }

    private static boolean startPatchedDash(Minecraft mc, JujutsuNeonMovementPatch.DashKind kind) {
        if (mc.player == null || mc.level == null) return false;
        if (!hasGroundSupport(mc, 0.36)) return false;

        long now = mc.level.getGameTime();
        if (now - lastDashStartTick < 10L) return false;

        String legacyAction = switch (kind) {
            case LEFT -> "LEFT_DASH";
            case RIGHT -> "RIGHT_DASH";
            case BACK -> "BACK_DASH";
            case FRONT -> "FRONT_DASH";
        };

        try {
            START_CLIENT_DASH.invoke(null, mc, movementAction(legacyAction));
        } catch (ReflectiveOperationException exception) {
            return false;
        }

        if (legacyDashMode() == 0) return false;

        desiredDashDirection = correctedDashDirection(mc, kind);
        activePatchedDash = kind;
        setLegacyDashDirection(desiredDashDirection);
        JujutsuNeonMovementPatch.sendDash(kind);
        startLegacyAnimation(kind);
        lastDashStartTick = now;
        return true;
    }

    private static boolean canStepUp(Minecraft mc, Vec3 direction, double probe) {
        if (mc.player == null || mc.level == null) return false;
        AABB box = mc.player.getBoundingBox();
        Vec3 horizontal = direction.scale(probe);
        for (double lift = 0.125; lift <= 2.0001; lift += 0.125) {
            if (mc.level.noCollision(mc.player, box.move(horizontal.x, lift, horizontal.z))) return true;
        }
        return false;
    }

    private static Vec3 wallSlideDirection(Minecraft mc, Vec3 desired, int dashMode) {
        if (mc.player == null || mc.level == null || desired.lengthSqr() < 1.0E-8) return desired;

        Vec3 direction = new Vec3(desired.x, 0.0, desired.z).normalize();
        AABB box = mc.player.getBoundingBox();
        double probe = 0.18;
        Vec3 fullStep = direction.scale(probe);

        if (mc.level.noCollision(mc.player, box.move(fullStep))) return direction;
        if (canStepUp(mc, direction, probe)) return direction;

        boolean xFree = Math.abs(direction.x) > 1.0E-5 &&
                mc.level.noCollision(mc.player, box.move(direction.x * probe, 0.0, 0.0));
        boolean zFree = Math.abs(direction.z) > 1.0E-5 &&
                mc.level.noCollision(mc.player, box.move(0.0, 0.0, direction.z * probe));

        if (xFree && zFree) {
            return Math.abs(direction.x) >= Math.abs(direction.z)
                    ? new Vec3(Math.signum(direction.x), 0.0, 0.0)
                    : new Vec3(0.0, 0.0, Math.signum(direction.z));
        }
        if (xFree) return new Vec3(Math.signum(direction.x), 0.0, 0.0);
        if (zFree) return new Vec3(0.0, 0.0, Math.signum(direction.z));
        return direction;
    }

    private static Vec3 steerTowards(Vec3 current, Vec3 target, double maxRadians) {
        Vec3 from = new Vec3(current.x, 0.0, current.z);
        Vec3 to = new Vec3(target.x, 0.0, target.z);
        if (to.lengthSqr() < 1.0E-8) return from;
        to = to.normalize();
        if (from.lengthSqr() < 1.0E-8) return to;
        from = from.normalize();

        double dot = Math.max(-1.0, Math.min(1.0, from.dot(to)));
        double crossY = from.x * to.z - from.z * to.x;
        double angle = Math.atan2(crossY, dot);
        double turn = Math.max(-maxRadians, Math.min(maxRadians, angle));
        double c = Math.cos(turn);
        double sn = Math.sin(turn);
        Vec3 rotated = new Vec3(
                from.x * c - from.z * sn,
                0.0,
                from.x * sn + from.z * c
        );
        return rotated.lengthSqr() > 1.0E-8 ? rotated.normalize() : to;
    }

    private static void adjustDashForWallSlide(Minecraft mc) {
        int mode = legacyDashMode();
        if (mode == 0 || desiredDashDirection.lengthSqr() < 1.0E-8) return;

        boolean longitudinal = mode == 1 &&
                (activePatchedDash == JujutsuNeonMovementPatch.DashKind.FRONT ||
                 activePatchedDash == JujutsuNeonMovementPatch.DashKind.BACK);

        if (longitudinal) {
            Vec3 target = horizontalForward(mc);
            if (activePatchedDash == JujutsuNeonMovementPatch.DashKind.BACK) target = target.scale(-1.0);
            desiredDashDirection = steerTowards(desiredDashDirection, target, Math.toRadians(34.0));
        }

        Vec3 actual = wallSlideDirection(mc, desiredDashDirection, mode);
        setLegacyDashDirection(actual);
        if (longitudinal) JujutsuNeonMovementPatch.sendFrontSteer(actual);
    }

    private static Vec3 customMovementDirection(Minecraft mc) {
        if (mc.player == null) return Vec3.ZERO;

        double forwardInput = (mc.options.keyUp.isDown() ? 1.0 : 0.0) -
                (mc.options.keyDown.isDown() ? 1.0 : 0.0);
        double strafeInput = (mc.options.keyRight.isDown() ? 1.0 : 0.0) -
                (mc.options.keyLeft.isDown() ? 1.0 : 0.0);

        if (Math.abs(forwardInput) < 1.0E-4 && Math.abs(strafeInput) < 1.0E-4) return Vec3.ZERO;

        Vec3 forward = horizontalForward(mc);
        Vec3 right = new Vec3(-forward.z, 0.0, forward.x);
        Vec3 result = forward.scale(forwardInput).add(right.scale(strafeInput));
        return result.lengthSqr() > 1.0E-6 ? result.normalize() : Vec3.ZERO;
    }

    /**
     * Server-authoritative vegetation clearing. The client only asks when its next
     * swept step is physically blocked; it never replaces a local block with AIR.
     */
    private static void requestSuperRunClear(Minecraft mc, Vec3 direction) {
        if (mc.player == null || mc.level == null || direction.lengthSqr() < 1.0E-8) return;

        Vec3 step = direction.normalize().scale(0.95);
        if (mc.level.noCollision(mc.player, mc.player.getBoundingBox().move(step))) return;

        long now = mc.level.getGameTime();
        if (now - lastSuperRunClearRequestTick < 2L) return;
        lastSuperRunClearRequestTick = now;
        JujutsuNeonMovementPatch.sendSuperRunClear(direction);
    }

    private static void spawnWaterRunPredictionVfx(Minecraft mc) {
        if (mc.player == null || mc.level == null) return;

        BlockPos below = BlockPos.containing(mc.player.getX(), mc.player.getY() - 0.18, mc.player.getZ());
        var fluid = mc.level.getFluidState(below);
        if (!fluid.is(FluidTags.WATER)) return;

        double surfaceY = below.getY() + fluid.getHeight(mc.level, below);
        if (mc.player.getY() < surfaceY - 0.48 || mc.player.getY() > surfaceY + 0.65) return;
        if ((mc.level.getGameTime() & 1L) != 0L) return;

        for (int i = 0; i < 6; i++) {
            double angle = Math.PI * 2.0 * i / 6.0;
            double radius = 0.28 + (i % 2) * 0.10;
            mc.level.addParticle(
                    i % 2 == 0 ? ParticleTypes.SPLASH : ParticleTypes.ELECTRIC_SPARK,
                    mc.player.getX() + Math.cos(angle) * radius,
                    surfaceY + 0.06,
                    mc.player.getZ() + Math.sin(angle) * radius,
                    Math.cos(angle) * 0.07,
                    0.08,
                    Math.sin(angle) * 0.07
            );
        }
    }

    @SubscribeEvent(priority = EventPriority.HIGHEST)
    public static void onClientTickHigh(TickEvent.ClientTickEvent event) {
        if (event.phase != TickEvent.Phase.END) return;

        Minecraft mc = Minecraft.getInstance();
        if (mc.player == null || mc.level == null) return;

        if (!hasBlindfold(mc) || mc.screen != null || mc.player.getAbilities().flying) {
            desiredDashDirection = Vec3.ZERO;
            activePatchedDash = null;
            return;
        }

        // This is the ONLY Q consumer for custom dash. If an item is held, the
        // custom mapping is consumed without starting prediction; vanilla Drop Item
        // remains free to perform its normal Q action.
        while (JujutsuNeonMod.ClientModEvents.DASH_KEY.consumeClick()) {
            if (!handsEmpty(mc)) continue;
            if (techniqueLocksMovement()) continue;
            if (legacyDashMode() != 0) continue;
            if (!hasGroundSupport(mc, 0.36)) continue; // Air Dash does not exist.

            boolean left = mc.options.keyLeft.isDown() && !mc.options.keyRight.isDown();
            boolean right = mc.options.keyRight.isDown() && !mc.options.keyLeft.isDown();
            boolean back = !left && !right && mc.options.keyDown.isDown() && !mc.options.keyUp.isDown();

            JujutsuNeonMovementPatch.DashKind kind;
            if (left) kind = JujutsuNeonMovementPatch.DashKind.LEFT;
            else if (right) kind = JujutsuNeonMovementPatch.DashKind.RIGHT;
            else if (back) kind = JujutsuNeonMovementPatch.DashKind.BACK;
            else kind = JujutsuNeonMovementPatch.DashKind.FRONT;

            startPatchedDash(mc, kind);
        }

        adjustDashForWallSlide(mc);

        if (JujutsuNeonMod.ClientModEvents.SUPER_SPEED_KEY.isDown() &&
                legacyDashMode() == 0 && !techniqueLocksMovement()) {
            Vec3 direction = customMovementDirection(mc);
            if (direction.lengthSqr() > 1.0E-8) {
                requestSuperRunClear(mc, direction);
                spawnWaterRunPredictionVfx(mc);
            }
        }

        if (legacyDashMode() == 0) {
            desiredDashDirection = Vec3.ZERO;
            activePatchedDash = null;
        }
    }
}
''', encoding='utf-8')

          # ------------------------------------------------------------------
          # 3) Rewrite server movement patch: no Air Dash + authoritative tree clear.
          # ------------------------------------------------------------------
          movement_server = root / 'JujutsuNeonMovementPatch.java'
          movement_server.write_text(r'''package com.kira.jujutsuneon;

import net.minecraft.core.BlockPos;
import net.minecraft.network.FriendlyByteBuf;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.server.level.ServerLevel;
import net.minecraft.server.level.ServerPlayer;
import net.minecraft.tags.BlockTags;
import net.minecraft.world.entity.EquipmentSlot;
import net.minecraft.world.entity.ExperienceOrb;
import net.minecraft.world.entity.item.ItemEntity;
import net.minecraft.world.level.ClipContext;
import net.minecraft.world.level.block.Blocks;
import net.minecraft.world.level.block.state.BlockState;
import net.minecraft.world.phys.AABB;
import net.minecraft.world.phys.BlockHitResult;
import net.minecraft.world.phys.HitResult;
import net.minecraft.world.phys.Vec3;
import net.minecraftforge.event.entity.EntityJoinLevelEvent;
import net.minecraftforge.event.entity.living.LivingAttackEvent;
import net.minecraftforge.event.entity.living.LivingHurtEvent;
import net.minecraftforge.event.entity.living.LivingKnockBackEvent;
import net.minecraftforge.event.level.ExplosionEvent;
import net.minecraftforge.eventbus.api.EventPriority;
import net.minecraftforge.eventbus.api.SubscribeEvent;
import net.minecraftforge.fml.common.Mod;
import net.minecraftforge.network.NetworkEvent;
import net.minecraftforge.network.NetworkRegistry;
import net.minecraftforge.network.simple.SimpleChannel;

import java.lang.reflect.Method;
import java.util.ArrayList;
import java.util.List;
import java.util.function.Supplier;

/** Server authority for dash direction, Super Run path clearing and Red owner safety. */
@Mod.EventBusSubscriber(modid = JujutsuNeonMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE)
public final class JujutsuNeonMovementPatch {

    private static final String PATCH_PROTOCOL = "2";
    private static final SimpleChannel PATCH_NETWORK = NetworkRegistry.newSimpleChannel(
            new ResourceLocation(JujutsuNeonMod.MODID, "movement_fix"),
            () -> PATCH_PROTOCOL, PATCH_PROTOCOL::equals, PATCH_PROTOCOL::equals
    );

    static {
        PATCH_NETWORK.registerMessage(0, DashPacket.class, DashPacket::encode, DashPacket::decode, DashPacket::handle);
        PATCH_NETWORK.registerMessage(1, FrontSteerPacket.class, FrontSteerPacket::encode, FrontSteerPacket::decode, FrontSteerPacket::handle);
        PATCH_NETWORK.registerMessage(2, SuperRunClearPacket.class, SuperRunClearPacket::encode, SuperRunClearPacket::decode, SuperRunClearPacket::handle);
    }

    private JujutsuNeonMovementPatch() {}

    public enum DashKind { FRONT, BACK, LEFT, RIGHT }

    public static void sendDash(DashKind kind) {
        PATCH_NETWORK.sendToServer(new DashPacket(kind));
    }

    public static void sendFrontSteer(Vec3 direction) {
        Vec3 horizontal = new Vec3(direction.x, 0.0, direction.z);
        if (horizontal.lengthSqr() < 1.0E-8) return;
        horizontal = horizontal.normalize();
        PATCH_NETWORK.sendToServer(new FrontSteerPacket(horizontal.x, horizontal.z));
    }

    public static void sendSuperRunClear(Vec3 direction) {
        Vec3 horizontal = new Vec3(direction.x, 0.0, direction.z);
        if (horizontal.lengthSqr() < 1.0E-8) return;
        horizontal = horizontal.normalize();
        PATCH_NETWORK.sendToServer(new SuperRunClearPacket(horizontal.x, horizontal.z));
    }

    private record DashPacket(DashKind kind) {
        static void encode(DashPacket msg, FriendlyByteBuf buf) { buf.writeEnum(msg.kind); }
        static DashPacket decode(FriendlyByteBuf buf) { return new DashPacket(buf.readEnum(DashKind.class)); }
        static void handle(DashPacket msg, Supplier<NetworkEvent.Context> supplier) {
            NetworkEvent.Context context = supplier.get();
            context.enqueueWork(() -> {
                ServerPlayer player = context.getSender();
                if (player != null) handlePatchedDash(player, msg.kind);
            });
            context.setPacketHandled(true);
        }
    }

    private record FrontSteerPacket(double x, double z) {
        static void encode(FrontSteerPacket msg, FriendlyByteBuf buf) {
            buf.writeDouble(msg.x); buf.writeDouble(msg.z);
        }
        static FrontSteerPacket decode(FriendlyByteBuf buf) {
            return new FrontSteerPacket(buf.readDouble(), buf.readDouble());
        }
        static void handle(FrontSteerPacket msg, Supplier<NetworkEvent.Context> supplier) {
            NetworkEvent.Context context = supplier.get();
            context.enqueueWork(() -> {
                ServerPlayer player = context.getSender();
                if (player == null || !player.isAlive() || player.isSpectator()) return;
                if (!hasBlindfold(player) || !handsEmpty(player)) return;
                if (player.getPersistentData().getInt("jn_dash_mode") != 1) return;

                Vec3 direction = new Vec3(msg.x, 0.0, msg.z);
                if (!Double.isFinite(direction.x) || !Double.isFinite(direction.z) || direction.lengthSqr() < 1.0E-8) return;
                direction = direction.normalize();
                player.getPersistentData().putDouble("jn_dash_dx", direction.x);
                player.getPersistentData().putDouble("jn_dash_dy", 0.0);
                player.getPersistentData().putDouble("jn_dash_dz", direction.z);
            });
            context.setPacketHandled(true);
        }
    }

    private record SuperRunClearPacket(double x, double z) {
        static void encode(SuperRunClearPacket msg, FriendlyByteBuf buf) {
            buf.writeDouble(msg.x); buf.writeDouble(msg.z);
        }
        static SuperRunClearPacket decode(FriendlyByteBuf buf) {
            return new SuperRunClearPacket(buf.readDouble(), buf.readDouble());
        }
        static void handle(SuperRunClearPacket msg, Supplier<NetworkEvent.Context> supplier) {
            NetworkEvent.Context context = supplier.get();
            context.enqueueWork(() -> {
                ServerPlayer player = context.getSender();
                if (player == null || !player.isAlive() || player.isSpectator()) return;
                if (!hasBlindfold(player) || player.getAbilities().flying) return;
                if (!player.getPersistentData().getBoolean("jn_super_speed")) return;
                if (player.getPersistentData().getInt("jn_dash_mode") != 0) return;

                Vec3 direction = new Vec3(msg.x, 0.0, msg.z);
                if (!Double.isFinite(direction.x) || !Double.isFinite(direction.z) || direction.lengthSqr() < 1.0E-8) return;
                clearSuperRunPath(player, direction.normalize());
            });
            context.setPacketHandled(true);
        }
    }

    private static boolean hasBlindfold(ServerPlayer player) {
        return player.getItemBySlot(EquipmentSlot.HEAD).is(JujutsuNeonMod.GOJO_BLINDFOLD.get());
    }

    private static boolean handsEmpty(ServerPlayer player) {
        return player.getMainHandItem().isEmpty() && player.getOffhandItem().isEmpty();
    }

    private static boolean hasGroundSupport(ServerPlayer player, double distance) {
        if (player.onGround()) return true;
        Vec3 start = player.position().add(0.0, 0.08, 0.0);
        Vec3 end = start.add(0.0, -Math.max(0.10, distance), 0.0);
        BlockHitResult hit = player.level().clip(new ClipContext(
                start, end, ClipContext.Block.COLLIDER, ClipContext.Fluid.NONE, player
        ));
        return hit.getType() != HitResult.Type.MISS;
    }

    private static Vec3 horizontalForward(ServerPlayer player) {
        Vec3 look = player.getLookAngle();
        Vec3 horizontal = new Vec3(look.x, 0.0, look.z);
        if (horizontal.lengthSqr() < 1.0E-6) {
            double yaw = Math.toRadians(player.getYRot());
            horizontal = new Vec3(-Math.sin(yaw), 0.0, Math.cos(yaw));
        }
        return horizontal.normalize();
    }

    private static Vec3 correctedDirection(ServerPlayer player, DashKind kind) {
        Vec3 forward = horizontalForward(player);
        Vec3 right = new Vec3(-forward.z, 0.0, forward.x).normalize();
        return switch (kind) {
            case LEFT -> right.scale(-1.0);
            case RIGHT -> right;
            case BACK -> forward.scale(-1.0);
            case FRONT -> forward;
        };
    }

    private static void invokeOriginalStartDash(ServerPlayer player, int side) {
        try {
            Method method = JujutsuNeonMod.class.getDeclaredMethod("startDash", ServerPlayer.class, int.class);
            method.setAccessible(true);
            method.invoke(null, player, side);
        } catch (ReflectiveOperationException exception) {
            throw new IllegalStateException("Unable to invoke Jujutsu Neon dash controller", exception);
        }
    }

    private static void handlePatchedDash(ServerPlayer player, DashKind kind) {
        if (!player.isAlive() || player.isSpectator()) return;
        if (!hasBlindfold(player) || !handsEmpty(player) || player.getAbilities().flying) return;
        if (!hasGroundSupport(player, 0.36)) return;

        int side = switch (kind) {
            case LEFT -> -1;
            case RIGHT -> 1;
            case BACK -> 2;
            case FRONT -> 0;
        };

        invokeOriginalStartDash(player, side);
        if (player.getPersistentData().getInt("jn_dash_mode") == 0) return;

        Vec3 direction = correctedDirection(player, kind);
        player.getPersistentData().putDouble("jn_dash_dx", direction.x);
        player.getPersistentData().putDouble("jn_dash_dy", 0.0);
        player.getPersistentData().putDouble("jn_dash_dz", direction.z);
    }

    private static boolean naturalGround(BlockState state) {
        return state.is(Blocks.DIRT) || state.is(Blocks.GRASS_BLOCK) || state.is(Blocks.PODZOL) ||
                state.is(Blocks.COARSE_DIRT) || state.is(Blocks.ROOTED_DIRT) ||
                state.is(Blocks.MUD) || state.is(Blocks.MYCELIUM);
    }

    /** Bounded natural-tree heuristic: no trunk/canopy BFS in a movement tick. */
    private static boolean isNaturalTreeLog(ServerLevel level, BlockPos pos) {
        if (!level.getBlockState(pos).is(BlockTags.LOGS)) return false;
        if (naturalGround(level.getBlockState(pos.below()))) return true;

        for (int dy = 0; dy <= 6; dy++) {
            for (int dx = -3; dx <= 3; dx++) {
                for (int dz = -3; dz <= 3; dz++) {
                    if (Math.abs(dx) + Math.abs(dz) > 5) continue;
                    if (level.getBlockState(pos.offset(dx, dy, dz)).is(BlockTags.LEAVES)) return true;
                }
            }
        }
        return false;
    }

    private static boolean superRunBreakable(ServerLevel level, BlockPos pos, BlockState state) {
        if (state.isAir()) return false;
        if (state.is(BlockTags.LEAVES) || state.is(BlockTags.FLOWERS) || state.is(BlockTags.SAPLINGS)) return true;
        if (state.is(BlockTags.LOGS)) return isNaturalTreeLog(level, pos);
        return state.is(Blocks.GRASS) || state.is(Blocks.TALL_GRASS) || state.is(Blocks.FERN) ||
                state.is(Blocks.LARGE_FERN) || state.is(Blocks.VINE) || state.is(Blocks.DEAD_BUSH) ||
                state.is(Blocks.SWEET_BERRY_BUSH) || state.is(Blocks.AZALEA) ||
                state.is(Blocks.FLOWERING_AZALEA) || state.is(Blocks.BAMBOO) || state.is(Blocks.SUGAR_CANE);
    }

    private static void clearSuperRunPath(ServerPlayer player, Vec3 direction) {
        ServerLevel level = player.serverLevel();
        AABB sweep = player.getBoundingBox()
                .expandTowards(direction.scale(1.35))
                .inflate(0.16, 1.05, 0.16);

        List<BlockPos> remove = new ArrayList<>();
        for (int x = (int)Math.floor(sweep.minX); x <= (int)Math.floor(sweep.maxX) && remove.size() < 32; x++) {
            for (int y = (int)Math.floor(sweep.minY); y <= (int)Math.floor(sweep.maxY) && remove.size() < 32; y++) {
                for (int z = (int)Math.floor(sweep.minZ); z <= (int)Math.floor(sweep.maxZ) && remove.size() < 32; z++) {
                    BlockPos pos = new BlockPos(x, y, z);
                    if (!level.hasChunkAt(pos)) continue;
                    BlockState state = level.getBlockState(pos);
                    if (superRunBreakable(level, pos, state)) remove.add(pos.immutable());
                }
            }
        }

        // Classify first, mutate second: removing the base log must not change the
        // classification of the next trunk block inside this same authoritative pass.
        for (BlockPos pos : remove) {
            BlockState state = level.getBlockState(pos);
            if (!state.isAir()) level.setBlock(pos, Blocks.AIR.defaultBlockState(), 3);
        }
    }

    @SubscribeEvent(priority = EventPriority.HIGHEST)
    public static void onRedExplosionDetonate(ExplosionEvent.Detonate event) {
        event.getAffectedEntities().removeIf(entity -> entity instanceof ServerPlayer player &&
                player.getPersistentData().getBoolean("jn_red_explosion_blocks_only"));
    }

    @SubscribeEvent(priority = EventPriority.HIGHEST)
    public static void onRedOwnerAttack(LivingAttackEvent event) {
        if (event.getEntity() instanceof ServerPlayer player &&
                player.getPersistentData().getBoolean("jn_red_explosion_blocks_only")) {
            event.setCanceled(true);
        }
    }

    @SubscribeEvent(priority = EventPriority.HIGHEST)
    public static void onRedOwnerHurt(LivingHurtEvent event) {
        if (event.getEntity() instanceof ServerPlayer player &&
                player.getPersistentData().getBoolean("jn_red_explosion_blocks_only")) {
            event.setCanceled(true);
        }
    }

    @SubscribeEvent(priority = EventPriority.HIGHEST)
    public static void onRedOwnerKnockback(LivingKnockBackEvent event) {
        if (event.getEntity() instanceof ServerPlayer player &&
                player.getPersistentData().getBoolean("jn_red_explosion_blocks_only")) {
            event.setCanceled(true);
        }
    }

    @SubscribeEvent(priority = EventPriority.HIGHEST)
    public static void onTechniqueDropSpawn(EntityJoinLevelEvent event) {
        if (event.getLevel().isClientSide()) return;
        if (!(event.getLevel() instanceof ServerLevel level)) return;
        if (!(event.getEntity() instanceof ItemEntity) && !(event.getEntity() instanceof ExperienceOrb)) return;

        for (ServerPlayer player : level.players()) {
            if (!player.getPersistentData().getBoolean("jn_red_explosion_blocks_only")) continue;
            if (player.distanceToSqr(event.getEntity()) > 144.0) continue;
            event.setCanceled(true);
            return;
        }
    }
