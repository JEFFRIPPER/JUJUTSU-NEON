name: Temporary Front Dash Distance Verification

on:
  push:
    branches: [main]

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Tune front dash to approximately fifteen blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/kira/jujutsuneon/JujutsuNeonMod.java')
          s=p.read_text(encoding='utf-8')
          old_server='double speed = 1.32 - 1.02 * t;'
          old_client='speed = 1.32 - 1.02 * t;'
          if s.count(old_server) != 1:
              raise SystemExit(f'expected one server speed formula, found {s.count(old_server)}')
          if s.count(old_client) != 1:
              raise SystemExit(f'expected one client speed formula, found {s.count(old_client)}')
          s=s.replace(old_server,'double speed = 1.68 - 1.30 * t;',1)
          s=s.replace(old_client,'speed = 1.68 - 1.30 * t;',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Forge compile and reobf
        run: gradle reobfJar --stacktrace --no-daemon
      - name: Commit verified distance tune
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/kira/jujutsuneon/JujutsuNeonMod.java
          git commit -m 'feat: tune steerable front dash to fifteen blocks [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: DashOverhaul-Distance-Reobf
          path: build/libs/*.jar
          if-no-files-found: error
