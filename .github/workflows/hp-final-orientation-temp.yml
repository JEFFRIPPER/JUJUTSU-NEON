name: Final Hollow Purple Reference Orientation

on:
  push:
    branches: [main]

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Match Blue/Red sides to video reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/kira/jujutsuneon/HollowPurpleReferenceClient.java')
          s = p.read_text(encoding='utf-8')
          old = '''        Vec3 redStart = backCenter.add(right.scale(-2.10));\n        Vec3 blueStart = backCenter.add(right.scale(2.10));'''
          new = '''        // Video reference: Blue is on the caster's left, Red on the right.\n        Vec3 blueStart = backCenter.add(right.scale(-2.10));\n        Vec3 redStart = backCenter.add(right.scale(2.10));'''
          if new not in s:
              if old not in s:
                  raise SystemExit('reference side block not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Forge reobf verification
        run: gradle reobfJar --stacktrace --no-daemon
      - name: Commit reference-side correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/kira/jujutsuneon/HollowPurpleReferenceClient.java
          if ! git diff --cached --quiet; then
            git commit -m 'fix: match Hollow Purple Blue Red sides to reference [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: HollowPurple-Reference-Final-Reobf
          path: build/libs/*.jar
          if-no-files-found: error
