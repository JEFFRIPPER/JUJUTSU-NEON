name: Temporary Skill Animation Compile

on:
  push:
    branches: [main]

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Fix Forge player event typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/kira/jujutsuneon/JujutsuNeonSkillAnimationClient.java')
          s = p.read_text(encoding='utf-8')
          old = 'boolean slim = "slim".equals(event.getEntity().getModelName());'
          new = 'boolean slim = "slim".equals(((AbstractClientPlayer) event.getEntity()).getModelName());'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('target line not found')
          PY
      - name: Forge compile and reobf
        run: gradle reobfJar --stacktrace --no-daemon
      - name: Java LOC
        run: wc -l src/main/java/com/kira/jujutsuneon/*.java
      - name: Commit verified source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/kira/jujutsuneon/JujutsuNeonSkillAnimationClient.java
          if ! git diff --cached --quiet; then
            git commit -m 'fix: finalize Blue and Purple full-body animation layer [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SkillAnimation-Reobf
          path: build/libs/*.jar
          if-no-files-found: error
