name: Capture cutscene frames

# Служебная съёмка: Minecraft с модом в виртуальном экране (программный OpenGL),
# катсцена Максимального Фиолетового, кадры — в артефакт. Релизы не трогает.
on:
  workflow_dispatch:
  push:
    branches:
      - 'capture/**'

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb mesa-utils libgl1-mesa-dri libegl1 libglx-mesa0 > /dev/null

      - name: Generate resources
        run: |
          python3 -m pip install --quiet pillow
          python3 generate_resources.py

      - name: Prepare game folder
        run: |
          mkdir -p run/config
          echo on > run/jn_capture.txt
          cat > run/options.txt <<'EOF'
          version:3465
          onboardAccessibility:false
          pauseOnLostFocus:false
          renderDistance:6
          simulationDistance:5
          maxFps:260
          enableVsync:false
          guiScale:2
          fov:0.0
          overrideWidth:960
          overrideHeight:540
          soundCategory_master:0.0
          tutorialStep:none
          skipMultiplayerWarning:true
          joinedFirstServer:true
          EOF
          cat > run/config/fml.toml <<'EOF'
          earlyWindowControl = false
          EOF

      - name: Run client and capture
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          set +e
          timeout 40m xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon > client.log 2>&1
          echo "exit=$?"
          grep -a "jn-capture\|Exception\|ERROR" client.log | head -60
          ls run/screenshots | wc -l
          exit 0

      - name: Push frames to branch
        run: |
          mkdir -p out
          cp client.log out/ || true
          grep -a "jn-capture\|Exception\|ERROR\|Caused by" client.log | head -300 > out/summary.txt || true
          if ls run/screenshots/*.png > /dev/null 2>&1; then
            python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in sorted(glob.glob('run/screenshots/*.png')):
              im = Image.open(p).convert('RGB')
              im.save('out/' + os.path.basename(p)[:-4] + '.jpg', quality=85)
          PY
          fi
          ls out | wc -l
          cd out
          git init -q
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git checkout -q -b "capture-results/${GITHUB_RUN_ID}"
          git add -A
          git commit -q -m "capture ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "capture-results/${GITHUB_RUN_ID}"

      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: capture-frames
          path: |
            run/screenshots/*.png
            client.log
          if-no-files-found: warn
