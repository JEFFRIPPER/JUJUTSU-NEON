name: Export compiled movement patch

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main/java/com/kira/jujutsuneon/JujutsuNeonMovementPatch*.java'
      - '.github/workflows/patch-export.yml'

jobs:
  export-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build reobfuscated Forge classes
        run: gradle reobfJar --stacktrace --no-daemon

      - name: Export reobfuscated patch classes as text
        run: |
          rm -rf patch_payload
          mkdir -p patch_payload
          python3 - <<'PY'
          import base64, pathlib, zipfile

          jars = sorted(pathlib.Path('build/libs').glob('*.jar'), key=lambda p: p.stat().st_size, reverse=True)
          if not jars:
              raise SystemExit('No built JAR found')

          prefix = 'com/kira/jujutsuneon/JujutsuNeonMovementPatch'
          exported = 0
          with zipfile.ZipFile(jars[0], 'r') as zf:
              for name in zf.namelist():
                  if not (name.startswith(prefix) and name.endswith('.class')):
                      continue
                  data = base64.b64encode(zf.read(name)).decode('ascii')
                  out = pathlib.Path('patch_payload') / (pathlib.Path(name).name + '.b64')
                  out.write_text('\n'.join(data[i:i+76] for i in range(0, len(data), 76)) + '\n', encoding='ascii')
                  exported += 1

          if not exported:
              raise SystemExit('No movement patch classes found in built JAR')
          print('exported', exported, 'class files')
          PY

      - name: Upload temporary compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: movement-patch-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Commit compiled patch payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A patch_payload
          if git diff --cached --quiet; then
            echo 'No payload changes'
          else
            git commit -m 'chore: refresh compiled movement patch [skip ci]'
            git push
          fi
