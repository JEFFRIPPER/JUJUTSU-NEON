name: Export compiled movement patch

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main/java/com/kira/jujutsuneon/JujutsuNeonMovementPatch*.java'
      - '.github/workflows/patch-export.yml'

jobs:
  export-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate resources
        run: |
          python3 -m pip install --quiet pillow
          python3 generate_resources.py

      - name: Build reobfuscated Forge mod
        run: gradle build --stacktrace --no-daemon

      - name: Export reobfuscated patch classes as text
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, zipfile

          jars = sorted(pathlib.Path('build/libs').glob('*.jar'), key=lambda p: p.stat().st_size, reverse=True)
          if not jars:
              raise SystemExit('No built JAR found')

          prefix = 'com/kira/jujutsuneon/JujutsuNeonMovementPatch'
          payload = {}
          with zipfile.ZipFile(jars[0], 'r') as zf:
              for name in zf.namelist():
                  if name.startswith(prefix) and name.endswith('.class'):
                      payload[name] = base64.b64encode(zf.read(name)).decode('ascii')

          if not payload:
              raise SystemExit('No movement patch classes found in built JAR')

          pathlib.Path('patch_classes.json').write_text(
              json.dumps(payload, sort_keys=True, separators=(',', ':')),
              encoding='utf-8'
          )
          print('exported', len(payload), 'class files')
          PY

      - name: Commit compiled patch payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patch_classes.json
          if git diff --cached --quiet; then
            echo 'No payload changes'
          else
            git commit -m 'chore: refresh compiled movement patch [skip ci]'
            git push
          fi
