name: Temporary source line count
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/loc-temp.yml'

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count Java source lines
        run: wc -l src/main/java/com/kira/jujutsuneon/*.java
