name: Temporary Flight Compile

on:
  push:
    branches: [main]

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Forge compile and reobf
        run: gradle reobfJar --stacktrace --no-daemon
      - name: Java LOC
        run: wc -l src/main/java/com/kira/jujutsuneon/*.java
      - uses: actions/upload-artifact@v4
        with:
          name: Flight-Reobf
          path: build/libs/*.jar
          if-no-files-found: error
