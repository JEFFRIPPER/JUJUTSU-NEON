name: Install Hollow Purple Reference Renderer

on:
  push:
    branches: [ main ]

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install reference renderer and route visual packets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          payload = ""
          source = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          target = Path('src/main/java/com/kira/jujutsuneon/HollowPurpleReferenceClient.java')
          target.write_text(source, encoding='utf-8')

          overhaul = Path('src/main/java/com/kira/jujutsuneon/HollowPurpleOverhaul.java')
          s = overhaul.read_text(encoding='utf-8')
          old = '() -> () -> HollowPurpleClient.accept(msg)'
          new = '() -> () -> HollowPurpleReferenceClient.accept(msg)'
          if old not in s and new not in s:
              raise SystemExit('Purple visual route not found')
          s = s.replace(old, new)
          overhaul.write_text(s, encoding='utf-8')

          main = Path('src/main/java/com/kira/jujutsuneon/JujutsuNeonMod.java')
          s = main.read_text(encoding='utf-8')
          s = s.replace(
              '            spawnHollowPurpleCastScene(player, level, now, elapsed);\n',
              '            // Reference renderer owns the complete cast scene client-side.\n'
          )

          s, n = re.subn(
              r'        double visualRadius = purpleBallRadius\(endDistance\);\n'
              r'        spawnPurpleMergedSphere\(.*?'
              r'        if \(endDistance >= PURPLE_END_DISTANCE\) \{',
              '        // Projectile body/trail are rendered as procedural 3D geometry on the client.\n\n'
              '        if (endDistance >= PURPLE_END_DISTANCE) {',
              s,
              flags=re.S
          )
          if n != 1:
              raise SystemExit(f'Expected one Purple projectile VFX block, replaced {n}')

          s = re.sub(
              r'        spawnStylizedShockwave\(level, origin, 4\.2, new Vector3f\(0\.72f, 0\.02f, 1\.0f\)\);\n'
              r'        spawnRadialStar\(.*?\n        \);\n',
              '        // Spatial shock/rings are rendered by HollowPurpleReferenceClient.\n',
              s,
              count=1,
              flags=re.S
          )
          main.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/hp-reference-install.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/kira/jujutsuneon/HollowPurpleReferenceClient.java src/main/java/com/kira/jujutsuneon/HollowPurpleOverhaul.java src/main/java/com/kira/jujutsuneon/JujutsuNeonMod.java .github/workflows/hp-reference-install.yml
          git commit -m 'feat: reference-grade 3D Hollow Purple renderer'
          git push
