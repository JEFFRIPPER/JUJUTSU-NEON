name: Temporary Hard Movement Contract Pass

on:
  push:
    branches:
      - movement-hard-contract-pass-2

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Apply hard movement patch
        run: python3 .github/scripts/movement_hard_contract_patch.py

      - name: Commit movement pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/kira/jujutsuneon/
          git commit -m "fix: enforce hard blindfold movement contract"
          git push

      - name: Build Forge mod
        run: gradle build --stacktrace --no-daemon

      - name: Verify movement contract
        run: |
          if grep -R -E "DASH_AIR|AIR_DASH|DashKind.AIR|preclearSuperRunPath" -n src/main/java/com/kira/jujutsuneon; then exit 1; fi
          grep -n "enum ClientMovementState" src/main/java/com/kira/jujutsuneon/JujutsuNeonMod.java
          grep -n "sendSuperRunClear" src/main/java/com/kira/jujutsuneon/JujutsuNeonMovementPatch.java
          grep -n "look.scale(forwardInput)" src/main/java/com/kira/jujutsuneon/JujutsuNeonFlightClient.java

      - name: Count Java lines
        run: find src/main/java -name '*.java' -print0 | xargs -0 wc -l

      - name: Upload reobfuscated JAR
        uses: actions/upload-artifact@v4
        with:
          name: Hard-Movement-Contract-Reobf
          path: build/libs/*.jar
          if-no-files-found: error
