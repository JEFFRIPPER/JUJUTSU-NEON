name: Temporary preclear correction builder
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-preclear-temp.yml'

jobs:
  patch-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Correct whole-path preclear
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/kira/jujutsuneon/JujutsuNeonMovementPatchClient.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import java.util.ArrayDeque;\nimport java.util.HashSet;\nimport java.util.Set;\n',
                        'import java.util.ArrayDeque;\nimport java.util.ArrayList;\nimport java.util.HashSet;\nimport java.util.List;\nimport java.util.Set;\n')
          start = s.index('    private static void preclearSuperRunPath(Minecraft mc, Vec3 direction) {')
          end = s.index('    private static void spawnWaterRunPredictionVfx(Minecraft mc) {', start)
          method = '''    private static void preclearSuperRunPath(Minecraft mc, Vec3 direction) {\n        if (mc.player == null || mc.level == null || direction.lengthSqr() < 1.0E-8) return;\n\n        AABB sweep = mc.player.getBoundingBox()\n                .expandTowards(direction.normalize().scale(0.95))\n                .inflate(0.10, 0.05, 0.10);\n\n        int minX = (int) Math.floor(sweep.minX);\n        int minY = (int) Math.floor(sweep.minY);\n        int minZ = (int) Math.floor(sweep.minZ);\n        int maxX = (int) Math.floor(sweep.maxX);\n        int maxY = (int) Math.floor(sweep.maxY);\n        int maxZ = (int) Math.floor(sweep.maxZ);\n\n        // Important: classify the whole swept volume against the unchanged world first.\n        // Removing the bottom log immediately can make the next log stop looking like\n        // part of a naturally grounded tree and reintroduce the collision bug.\n        List<BlockPos> toRemove = new ArrayList<>();\n\n        for (int x = minX; x <= maxX; x++) {\n            for (int y = minY; y <= maxY; y++) {\n                for (int z = minZ; z <= maxZ; z++) {\n                    BlockPos pos = new BlockPos(x, y, z);\n                    BlockState state = mc.level.getBlockState(pos);\n                    if (isSuperRunBreakable(mc.level, pos, state)) {\n                        toRemove.add(pos.immutable());\n                    }\n                }\n            }\n        }\n\n        for (BlockPos pos : toRemove) {\n            // Prediction only: no drops are created client-side. The server performs\n            // the same authoritative no-drop vaporization for the travelled path.\n            mc.level.setBlock(pos, Blocks.AIR.defaultBlockState(), 11);\n        }\n    }\n\n'''
          s = s[:start] + method + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build reobfuscated classes
        run: gradle reobfJar --stacktrace --no-daemon
      - name: Count Java source lines
        run: wc -l src/main/java/com/kira/jujutsuneon/*.java
      - name: Upload patched build
        uses: actions/upload-artifact@v4
        with:
          name: preclear-fixed-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Commit source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/kira/jujutsuneon/JujutsuNeonMovementPatchClient.java
          git commit -m 'fix: preclear complete natural tree path [skip ci]'
          git push
