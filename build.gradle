plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Player Animator (KosmX, MIT). Уже в продакшн-именах (SRG), поэтому только для компиляции
    // и вшивается внутрь нашего jar как есть (Forge Jar-in-Jar), см. jar { ... } ниже.
    compileOnly files('libs/player-animation-lib-forge-1.0.2-rc1+1.20.jar')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'Kira / SQUAD',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'Kira / SQUAD'
        ])
    }
    // Вшитые библиотеки: игроку по-прежнему нужен один .jar.
    from('libs') {
        include 'player-animation-lib-forge-1.0.2-rc1+1.20.jar'
        into 'META-INF/jarjar'
    }
    from('src/jarjar') {
        include 'metadata.json'
        into 'META-INF/jarjar'
    }
    from('THIRD_PARTY_NOTICES.md')
    finalizedBy 'reobfJar'
}
