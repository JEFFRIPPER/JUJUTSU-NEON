name: Build Jujutsu Neon JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate 4K resources and audio
        run: |
          python3 -m pip install --quiet pillow
          python3 generate_resources.py

      - name: Build Forge mod
        run: gradle build --stacktrace --no-daemon

      - name: Show output
        run: |
          ls -lah build/libs/
          unzip -l build/libs/*.jar | grep -E "META-INF/jarjar|THIRD_PARTY" || (echo "jarjar missing" && exit 1)
          unzip -p build/libs/*.jar META-INF/jarjar/metadata.json

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: JujutsuNeon-JAR
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish release with JAR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "Jujutsu Neon ${VERSION} (сборка ${GITHUB_RUN_NUMBER})" \
            --notes-file CHANGELOG.md \
            --latest
