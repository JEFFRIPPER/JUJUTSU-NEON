name: Build Jujutsu Neon JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Install audio tools
        timeout-minutes: 10
        run: |
          # ffmpeg (статическая сборка с libvorbis) из PyPI: apt-зеркала GitHub иногда виснут на десятки минут
          python3 -m pip install --quiet imageio-ffmpeg==0.6.0
          sudo ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libvorbis

      - name: Generate 4K resources and audio
        run: |
          python3 -m pip install --quiet pillow
          python3 generate_resources.py

      - name: Build Forge mod
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          # Ошибки компиляции — аннотациями (их видно через API, даже когда логи недоступны).
          python3 - <<'PY'
          import re
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          out = []
          for i, l in enumerate(lines):
              if re.search(r'\.java:\d+: error:', l) or 'What went wrong' in l:
                  msg = ' | '.join(x.strip() for x in lines[i:i + 3])
                  out.append(msg.replace('%', '%25').replace('\r', '').replace('\n', ' '))
          for m in out[:10]:
              print('::error::' + m[:900])
          if not out:
              for l in lines[-15:]:
                  print('::error::' + l[:900])
          PY

      - name: Show output
        run: |
          ls -lah build/libs/
          unzip -l build/libs/*.jar | grep -E "META-INF/jarjar|THIRD_PARTY" || (echo "jarjar missing" && exit 1)
          unzip -p build/libs/*.jar META-INF/jarjar/metadata.json

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: JujutsuNeon-JAR
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish release with JAR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "Jujutsu Neon ${VERSION} (сборка ${GITHUB_RUN_NUMBER})" \
            --notes-file CHANGELOG.md \
            --latest

      - name: Publish test pre-release (not main)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          TAG="v${VERSION}-test-${BRANCH}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "Jujutsu Neon ${VERSION} — тестовая сборка ${GITHUB_RUN_NUMBER}" \
            --notes "Тестовая сборка ветки ${GITHUB_REF_NAME} (не основной релиз). Что нового — CHANGELOG.md." \
            --prerelease
