name: Temporary Hollow Purple Back Fusion Pass

on:
  push:
    branches: [main]

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Apply Hollow Purple back-fusion choreography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main/java/com/kira/jujutsuneon/HollowPurpleReferenceClient.java')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'    private static void renderCast\(.*?\n    private static void renderLimitlessModel\(',
              re.S
          )

          new_method = r'''    private static void renderCast(
                  PoseStack pose,
                  Vec3 camera,
                  Vec3 eye,
                  Vec3 direction,
                  float progress,
                  float alpha,
                  double time
          ) {
              Vec3 right = rightFor(direction);
              Vec3 up = right.cross(direction).normalize();

              Vec3 backCenter = eye.subtract(direction.scale(1.30)).add(0.0, -0.18, 0.0);
              // Reference choreography: Blue is on the caster's left, Red on the right,
              // and BOTH poles remain behind the caster for their entire visible merge.
              Vec3 blueStart = backCenter.add(right.scale(-2.10));
              Vec3 redStart = backCenter.add(right.scale(2.10));
              Vec3 fusionPoint = eye.subtract(direction.scale(1.65)).add(0.0, -0.12, 0.0);

              // Purple is NOT the same object travelling through the caster.  It is a
              // separate phase born in front only after Red/Blue have vanished behind.
              Vec3 purplePoint = eye.add(direction.scale(2.35)).add(0.0, -0.12, 0.0);

              float p = Mth.clamp(progress, 0.0f, 1.0f);

              // 0.00 - 0.32: Red/Blue materialize behind the caster as 3D Limitless orbs.
              if (p < 0.32f) {
                  float grow = (float) smooth(p / 0.32f);
                  float radius = 0.16f + grow * 1.10f;
                  renderLimitlessModel(pose, camera, redStart, direction, radius, alpha, time, false);
                  renderLimitlessModel(pose, camera, blueStart, direction, radius, alpha, time, true);
                  renderEnergyBridge(pose, camera, redStart, blueStart, alpha * grow * 0.28f, time, 11.0);
                  return;
              }

              // 0.32 - 0.58: Red/Blue converge ONLY behind the caster.  They shrink and
              // disappear at the rear fusion point; no Purple body exists there and
              // neither colored pole is ever interpolated toward the front of the player.
              if (p < 0.58f) {
                  float merge = (float) smooth((p - 0.32f) / 0.26f);
                  Vec3 red = redStart.lerp(fusionPoint, merge);
                  Vec3 blue = blueStart.lerp(fusionPoint, merge);
                  float vanish = (float) smooth((merge - 0.70f) / 0.30f);
                  float poleAlpha = alpha * (1.0f - vanish);
                  float radius = 1.26f - merge * 0.82f;

                  if (poleAlpha > 0.01f) {
                      renderLimitlessModel(pose, camera, red, direction, radius, poleAlpha, time, false);
                      renderLimitlessModel(pose, camera, blue, direction, radius, poleAlpha, time, true);
                      renderEnergyBridge(
                              pose,
                              camera,
                              red,
                              blue,
                              alpha * (0.42f + merge * 0.35f) * (1.0f - vanish),
                              time,
                              19.0
                      );
                  }
                  return;
              }

              // 0.58 - 0.74: the rear Red/Blue pair is already gone.  A completely
              // separate Purple seed appears IN FRONT of the caster and grows there.
              if (p < 0.74f) {
                  float birth = (float) smooth((p - 0.58f) / 0.16f);
                  float radius = 0.10f + birth * 1.16f;
                  float purpleAlpha = alpha * birth;

                  renderPurpleModel(
                          pose,
                          camera,
                          purplePoint,
                          direction,
                          radius,
                          purpleAlpha,
                          time,
                          0.86f + birth * 0.08f,
                          0.12f + birth * 0.28f
                  );

                  additiveBlend();
                  for (int i = 0; i < 3; i++) {
                      Vec3 normal = safeDirection(direction
                              .add(right.scale((i - 1) * 0.34))
                              .add(up.scale((1 - i) * 0.23)));
                      drawFracturedRingAt(
                              pose,
                              camera,
                              purplePoint,
                              normal,
                              radius * (1.42f + i * 0.17f),
                              Math.max(0.010f, radius * 0.040f),
                              time * (2.6 + i * 0.44),
                              i == 1 ? MAGENTA : PURPLE,
                              LAVENDER,
                              purpleAlpha * (0.52f - i * 0.06f),
                              0.08f,
                              17.0 + i * 13.0,
                              false
                      );
                  }
                  return;
              }

              // 0.74 - 1.00: preserve the successful front charge/growth/release setup.
              float charge = (float) smooth((p - 0.74f) / 0.26f);
              float pulse = 1.0f + (float) Math.sin(time * 0.84) * (0.025f + charge * 0.020f);
              float radius = (1.20f + charge * 0.84f) * pulse;
              float stress = (float) smooth((p - 0.84f) / 0.16f);

              renderPurpleModel(pose, camera, purplePoint, direction, radius, alpha, time,
                      0.94f + charge * 0.06f, 0.28f + stress * 0.58f);

              renderCompressionCage(pose, camera, purplePoint, direction, right, up,
                      radius, stress, alpha, time);

              if (stress > 0.001f) {
                  renderPreReleaseRupture(pose, camera, purplePoint, direction, right, up,
                          radius, stress, alpha, time);
              }
          }

          private static void renderLimitlessModel('''

          out, count = pattern.subn(new_method, s, count=1)
          if count != 1:
              raise SystemExit(f'renderCast replacement expected 1 match, got {count}')

          p.write_text(out, encoding='utf-8')
          PY

      - name: Choreography assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/main/java/com/kira/jujutsuneon/HollowPurpleReferenceClient.java').read_text(encoding='utf-8')
          checks = {
              'rear fusion point': 'Vec3 fusionPoint = eye.subtract(direction.scale(1.65))' in s,
              'separate front purple point': 'Vec3 purplePoint = eye.add(direction.scale(2.35))' in s,
              'red merges rear': 'redStart.lerp(fusionPoint, merge)' in s,
              'blue merges rear': 'blueStart.lerp(fusionPoint, merge)' in s,
              'purple born front': 'renderPurpleModel(\n                        pose,\n                        camera,\n                        purplePoint' in s,
              'no old front merge point': 'Vec3 mergePoint = eye.add(direction.scale(2.35))' not in s,
              'no purple rear midpoint seed': 'Vec3 midpoint = red.lerp(blue, 0.5)' not in s,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Choreography assertions failed: ' + ', '.join(failed))
          print('Hollow Purple choreography assertions: PASS')
          PY
          git diff --check

      - name: Forge compile and reobf
        run: gradle reobfJar --stacktrace --no-daemon

      - name: LOC and diff
        run: |
          wc -l src/main/java/com/kira/jujutsuneon/*.java
          git diff --stat
          git diff --numstat

      - name: Commit verified choreography
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/kira/jujutsuneon/HollowPurpleReferenceClient.java
          git commit -m 'fix: merge Red and Blue behind caster before Purple birth [skip ci]'
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: HollowPurple-BackFusion-Reobf
          path: build/libs/*.jar
          if-no-files-found: error
