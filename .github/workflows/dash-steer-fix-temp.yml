name: Temporary Dash Steering Sign Verification

on:
  push:
    branches: [main]

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Fix steering rotation sign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/kira/jujutsuneon/JujutsuNeonMovementPatchClient.java')
          s=p.read_text(encoding='utf-8')
          old='double crossY = from.z * to.x - from.x * to.z;'
          new='double crossY = from.x * to.z - from.z * to.x;'
          if old not in s:
              raise SystemExit('steering sign target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Forge compile and reobf
        run: gradle reobfJar --stacktrace --no-daemon
      - name: Commit verified sign fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/kira/jujutsuneon/JujutsuNeonMovementPatchClient.java
          git commit -m 'fix: steer front dash toward camera [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: DashOverhaul-Final-Reobf
          path: build/libs/*.jar
          if-no-files-found: error
